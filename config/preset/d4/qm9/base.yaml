# @package _global_
defaults:
 - override /task: qm9_3d
 - override /logger: wandb
 - override /method: d4
 - override /method/trainer: molecular_trainer
 - override /method/dataloader: [base_dataloader, batch_1024, workers_8]
 - override /method/callbacks: ckpt_ema_bond_dist

method:
    model:
        params:
            embed_time: true
            features:
                - indegree
                - nodes_num
                - spectral
    trainer:
        max_epochs: 1000
        log_every_n_steps: 400
        check_val_every_n_epoch: 10
        gradient_clip_val: 1.0
    
    callbacks:
        early_stopping:
            EarlyStopping:
                patience: 20

logger:
    WandbLogger:
        project: d4-generation
        group: qm9-d4

config_name: qm9-d4


mode: train+eval
compile: true