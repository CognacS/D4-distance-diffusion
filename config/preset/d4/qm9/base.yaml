# @package _global_
defaults:
 - /method/model/architecture/graph_transformer@method.model.params.denoising.architecture: gt_large_distance_orig_qm9
 - override /task: qm9_3d
 - override /logger: wandb
 - override /method: d4
 - override /method/trainer: molecular_trainer
 - override /method/dataloader: [base_dataloader, batch_1024, workers_8]
 - override /method/callbacks: ckpt_orig_d4

method:
    model:
        params:
            generation:
                batch_size: 1024
            validation:
                how_many_to_generate: 1024

            embed_time: true
            features:
                - indegree
                - nodes_num
                - spectral
            denoising:
                loss:
                    lambda_train_X: 1.0
                    lambda_train_C: 1.0
                    lambda_train_E: 2.0
                    lambda_train_D: 1.0
    trainer:
        log_every_n_steps: 400
        #gradient_clip_val: 1.0
    
    callbacks:
        early_stopping:
            EarlyStopping:
                patience: 30

logger:
    WandbLogger:
        project: d4-generation
        group: qm9-d4

config_name: qm9-d4


mode: train+eval
compile: true